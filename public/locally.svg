<svg width="500" height="180" viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Green gradient -->
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"></stop>
      <stop offset="100%" stop-color="#16a34a"></stop>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Soft background -->
  <rect width="100%" height="100%" rx="24" fill="#ecfdf5"></rect>

  <!-- Main text -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Nunito, Verdana, sans-serif" font-weight="700" font-size="64" fill="url(#gradGreen)" filter="url(#shadow)">
    Locally
  </text>

  <!-- Glow overlay -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="Nunito, Verdana, sans-serif" font-weight="700" font-size="64" fill="url(#gradGreen)" opacity="0.35" filter="url(#glow)">
    Locally
  </text>
</svg>